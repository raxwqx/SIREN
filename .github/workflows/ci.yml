name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Build (release)
        run: cargo build --release

      - name: Evaluation smoke test
        run: |
          cargo run --release -- gen --out data/ci-eval.jsonl --seed 42
          cargo run --release -- eval data/ci-eval.jsonl --window 300 --json

      - name: Summary smoke test
        run: |
          cargo run --release -- summary data/ci-eval.jsonl --top 5 --no-banner
          cargo run --release -- summary data/ci-eval.jsonl --top 5 --format json

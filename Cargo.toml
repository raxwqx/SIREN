[workspace]
resolver = "2"
members = ["crates/siren-core", "crates/siren-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["StyxHQ"]
repository = "https://github.com/raxwqx/SIREN"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

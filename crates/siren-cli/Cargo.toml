[package]
name = "siren-cli"
description = "DNS covert-channel detection, measured. Explainable Rust engine with an evaluation harness."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["dns", "security", "dfir", "exfiltration", "pcap"]
categories = ["command-line-utilities", "network-programming", "parsing"]

[[bin]]
name = "siren"
path = "src/main.rs"

[dependencies]
siren-core = { path = "../siren-core" }
clap.workspace = true
crossterm.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
